name: Create UI Kit Release from PR

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-ui-kit:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.title, 'release') &&
       contains(github.event.pull_request.title, 'ui-kit') &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')

    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm version for OIDC publish
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build UI Kit
        run: npm run build --workspace=@sama-communications/ui-kit

      - name: Publish to npm
        run: npm publish --access public --workspace=@sama-communications/ui-kit

  create-release:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.title, 'release') &&
       contains(github.event.pull_request.title, 'ui-kit') &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    needs: publish-ui-kit
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Extract Version
        id: extract-version
        run: |
          # Use grep to find the first occurrence of the version number matching "## 0.0.0" pattern
          version=$(grep -m 1 -oP '## \d+\.\d+\.\d+' packages/ui-kit/CHANGELOG.md | cut -d ' ' -f 2)
          echo "version=$version" >> $GITHUB_ENV

      - name: Extract Changelog
        id: extract-changelog
        run: |
          # Extract the content between the last two version headers
          changelog=$(awk '/^## [0-9]+\.[0-9]+\.[0-9]+/{if (!version) {version=$0; next}} /^## [0-9]+\.[0-9]+\.[0-9]+/{exit} {if (version) description = description ORS $0} END {if (version) print description}' packages/ui-kit/CHANGELOG.md | sed -e '/^## [0-9]+\.[0-9]+\.[0-9]+/d; s/^# //' > changelog.txt)
          echo "changelog_file=changelog.txt" >> $GITHUB_ENV

      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ui-kit-${{ env.version }}
          release_name: ui-kit-${{ env.version }}
          body_path: ${{ env.changelog_file }}
          draft: false
          prerelease: false

      - name: Post to a Slack channel
        if: success()
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REPOSITORY_NAME: ${{ github.repository }}
          AUTHOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || github.actor }}
          REVIEWERS: ${{ github.event_name == 'workflow_dispatch' && 'manual' || join(github.event.pull_request.requested_reviewers.*.login, ', ') }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/ui-kit-${{ env.version }}
        with:
          # You can pass in multiple channels to post to by providing a comma-delimited list of channel IDs.
          channel-id: "git-releases"
          payload-file-path: "./.github/slack/payload-slack-content.json"
